name: Integração CI
on:
  push:
    branches: ['integration/**']
  pull_request:
    branches: ['integration/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DEBUG: 'True'
      SECRET_KEY: ci-only-abcdefghijklmnopqrstuvwxyz-ABCDEFGHIJKLMNOPQRSTUVWXYZ-123456789
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Migrations em sincronia com os models
        run: python manage.py makemigrations --check --dry-run
      - name: Migrar banco descartável
        run: python manage.py migrate --noinput
      - name: Testes (carrinho, garçom, conciliação, dashboard/Excel)
        run: python manage.py test --noinput
