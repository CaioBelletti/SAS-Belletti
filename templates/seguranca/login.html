{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — Belletti Cards Universe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card {
            width: 100%; max-width: 340px; background: var(--bg-1);
            border: 1px solid var(--border); border-radius: 14px; padding: 32px;
        }
        .login-card .brand { justify-content: center; padding-bottom: 24px; }
        .login-card h1 { font-family: var(--font-display); font-size: 18px; text-align: center; margin: 0 0 24px; }
        .login-card label { font-size: 12.5px; color: var(--text-muted); display: block; margin: 14px 0 6px; }
        .login-card input {
            width: 100%; padding: 10px 12px; border-radius: 8px;
            border: 1px solid var(--border); background: var(--bg-2); color: var(--text-primary); font-size: 13.5px;
        }
        .login-card button {
            width: 100%; margin-top: 20px; padding: 11px; border-radius: 8px; border: none;
            background: var(--accent); color: white; font-weight: 600; font-size: 14px; cursor: pointer;
        }
        .login-card button:hover { filter: brightness(1.08); }
        .msg { padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
        .msg.error { background: #f26d6d22; color: #f26d6d; border: 1px solid #f26d6d55; }
        .msg.success { background: #4ade8022; color: #4ade80; border: 1px solid #4ade8055; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand"><img src="{% static 'images/logo-icone.png' %}" alt="Belletti Cards Universe" style="height:52px;width:auto;"></div>
        <h1>Belletti Cards Universe</h1>
        {% if messages %}
        {% for message in messages %}
        <div class="msg {{ message.tags }}">{{ message }}</div>
        {% endfor %}
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <label>Usuário</label>
            <input type="text" name="username" autofocus required>
            <label>Senha</label>
            <input type="password" name="password" required>
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit">Entrar</button>
        </form>
    </div>
</body>
</html>
