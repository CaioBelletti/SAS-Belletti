{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação em duas etapas — Belletti Cards Universe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card {
            width: 100%; max-width: 340px; background: var(--bg-1);
            border: 1px solid var(--border); border-radius: 14px; padding: 32px;
        }
        .login-card .brand { justify-content: center; padding-bottom: 16px; }
        .login-card h1 { font-family: var(--font-display); font-size: 17px; text-align: center; margin: 0 0 6px; }
        .login-card p { font-size: 13px; color: var(--text-muted); text-align: center; margin: 0 0 20px; }
        .login-card input {
            width: 100%; padding: 12px; border-radius: 8px; text-align: center;
            border: 1px solid var(--border); background: var(--bg-2); color: var(--text-primary);
            font-size: 22px; font-family: var(--font-mono); letter-spacing: 6px;
        }
        .login-card button {
            width: 100%; margin-top: 16px; padding: 11px; border-radius: 8px; border: none;
            background: var(--accent); color: white; font-weight: 600; font-size: 14px; cursor: pointer;
        }
        .msg { padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
        .msg.error { background: #f26d6d22; color: #f26d6d; border: 1px solid #f26d6d55; }
    </style>
    <link rel="stylesheet" href="{% static 'auth-v2/auth.css' %}">
    <style>body.auth-enhanced{display:block}#auth-fallback[hidden]{display:none!important}#auth-root:empty{display:none}</style>
</head>
<body>
    <div class="login-card" id="auth-fallback">
        <div class="brand"><img src="{% static 'images/logo-icone.png' %}" alt="Belletti Cards Universe" style="height:52px;width:auto;"></div>
        <h1>Verificação em duas etapas</h1>
        <p>Digite o código de seis dígitos ou um código de recuperação.</p>
        {% if messages %}
        {% for message in messages %}
        <div class="msg {{ message.tags }}">{{ message }}</div>
        {% endfor %}
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <label for="metodo">Método de verificação</label>
            <select id="metodo" name="metodo"><option value="totp">Aplicativo autenticador</option><option value="recuperacao">Código de recuperação</option></select>
            <label for="codigo">Código</label>
            <input id="codigo" type="text" name="codigo" autocomplete="one-time-code" maxlength="35" autofocus required>
            <button type="submit">Verificar</button>
        </form>
    </div>
    <div id="auth-root" data-step="2fa" data-csrf="{{ csrf_token }}" data-next="{{ next }}" data-lock="{{ bloqueio_segundos|default:0 }}" data-logo="{% static 'images/logo-icone.png' %}"></div>
    <script type="module" src="{% static 'auth-v2/auth.js' %}"></script>
</body>
</html>
