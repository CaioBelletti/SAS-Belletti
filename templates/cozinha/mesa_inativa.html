{% load static %}<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa indisponível — Belletti Cards Universe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <style>
        body {
            display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 28px;
            text-align: center; background: var(--bg-0);
        }
        .caixa { max-width: 320px; animation: aparecer .4s ease; }
        @keyframes aparecer { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .icone { font-size: 34px; margin-bottom: 14px; opacity: .85; }
        h2 { font-family: var(--font-display); font-size: 19px; margin: 0 0 8px; }
        p { color: var(--text-muted); font-size: 13.5px; line-height: 1.5; margin: 0; }
    </style>
</head>
<body>
{% csrf_token %}
    <div class="caixa">
        <div class="icone">🍽️</div>
        <h2>Essa mesa não está disponível agora</h2>
        <p>Chame um atendente pra te ajudar.</p>
    </div>
</body>
</html>
