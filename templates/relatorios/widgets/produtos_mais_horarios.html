<div class="grid grid-2" style="margin-bottom: 0;">
    <div class="card">
        <div class="card-title">Produtos mais vendidos</div>
        <table>
            <thead>
                <tr><th>Produto</th><th>SKU</th><th>Qtd</th><th>Valor</th></tr>
            </thead>
            <tbody>
                {% for produto in top_produtos %}
                <tr>
                    <td>{{ produto.produto__nome }}</td>
                    <td class="num">{{ produto.produto__sku }}</td>
                    <td class="num">{{ produto.quantidade_total }}</td>
                    <td class="num">R$ {{ produto.valor_total|floatformat:2 }}</td>
                </tr>
                {% empty %}
                <tr><td colspan="4" class="empty-row">Nenhuma venda fechada ainda.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <div class="card">
        <div class="card-title">Horários com mais vendas</div>
        <canvas id="graficoHorarios" height="180"></canvas>
    </div>
</div>
