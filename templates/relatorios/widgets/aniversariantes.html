<div class="card" style="margin-bottom: 0;">
    <div class="card-title"><svg viewBox="0 0 24 24" stroke="currentColor"><path d="M20 12v9H4v-9M2 7h20v5H2z"/><path d="M12 22V7M12 7c-1.5 0-3-1-3-2.5S10.5 2 12 2s3 1 3 2.5S13.5 7 12 7z"/></svg> Aniversariantes do mês</div>
    <table>
        <thead><tr><th>Cliente</th><th>Dia</th><th>Telefone</th></tr></thead>
        <tbody>
            {% for c in aniversariantes %}
            <tr>
                <td>{{ c.nome }}</td>
                <td class="num" style="color: {% if c.data_nascimento.day == hoje_dia %}var(--gold){% else %}var(--text-primary){% endif %};">
                    {{ c.data_nascimento|date:"d/m" }}{% if c.data_nascimento.day == hoje_dia %} — hoje! 🎉{% endif %}
                </td>
                <td class="num">{{ c.telefone|default:"—" }}</td>
            </tr>
            {% empty %}
            <tr><td colspan="3" class="empty-row">Nenhum aniversariante cadastrado esse mês.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
