name: Auth frontend validation
on:
  push:
    branches: [fix/auth-frontend-ci]
  pull_request:
    paths: ['frontend/auth/**', '.github/workflows/auth-frontend.yml']
permissions:
  contents: write
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/auth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate lockfile if missing
        run: |
          if [ ! -f package-lock.json ]; then npm install --package-lock-only --ignore-scripts --no-audit --no-fund; fi
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Commit generated lockfile on validation branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/auth-frontend-ci'
        run: |
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: pin auth frontend dependencies"
            git push origin HEAD:fix/auth-frontend-ci
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: auth-package-lock
          path: frontend/auth/package-lock.json
          if-no-files-found: error
