name: Auth deployment smoke
on:
  push:
    branches: [fix/auth-deploy-smoke]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify staging login and assets
        shell: bash
        run: |
          set -euo pipefail
          base=https://web-production-5c8ef.up.railway.app
          for attempt in $(seq 1 60); do
            if curl -fsS "$base/login/" -o login.html && grep -q 'id="auth-root"' login.html; then break; fi
            sleep 10
          done
          grep -q 'id="auth-root"' login.html
          python - <<'PY'
          import re, urllib.request, urllib.parse
          html=open("login.html").read()
          base="https://web-production-5c8ef.up.railway.app"
          for ext in ("js","css"):
              matches=re.findall(r'["\x27]([^"\x27]*auth-v2/auth[^"\x27]*\.'+ext+r')["\x27]',html)
              assert matches, ext
              with urllib.request.urlopen(urllib.parse.urljoin(base,matches[0])) as response:
                  assert response.status==200 and len(response.read())>100
          print("AUTH_HTTP_OK")
          PY
