name: RC9 release validation
on:
  push:
    branches: [release/belletti-rc9]
permissions:
  contents: read
jobs:
  login:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DEBUG: 'False'
      SECRET_KEY: ci-only-abcdefghijklmnopqrstuvwxyz-ABCDEFGHIJKLMNOPQRSTUVWXYZ-123456789
      ALLOWED_HOSTS: localhost,testserver
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/auth/package-lock.json
      - name: Build frontend from lockfile
        working-directory: frontend/auth
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx vite build --config vite.dashboard.config.ts
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --noinput
      - run: python manage.py collectstatic --noinput
      - run: DEBUG=True python manage.py test --noinput
      - run: |
          python - <<'PY'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE","core.settings")
          import django
          django.setup()
          from django.test import Client
          r=Client().get("/login/",secure=True)
          assert r.status_code==200,r.status_code
          from django.contrib.staticfiles.storage import staticfiles_storage
          for asset in ("auth-v2/auth.css","auth-v2/auth.js","dashboard-v2/dashboard.css","dashboard-v2/dashboard.js"):
              assert staticfiles_storage.exists(asset), asset
              assert staticfiles_storage.url(asset), asset
          PY
