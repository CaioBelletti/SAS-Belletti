name: Cardapio release gate
on:
  push:
    branches: ['release/cardapio-producao-rc*']
  pull_request:
    branches: ['release/cardapio-producao-rc*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: cardapio_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DEBUG: 'False'
      DATABASE_URL: postgres://ci:ci@localhost:5432/cardapio_ci
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: https://localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Generate ephemeral CI secret
        run: echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(64))')" >> "$GITHUB_ENV"
      - name: Preflight
        run: sh scripts/check_cardapio_release.sh
      - name: Migrate disposable database
        run: python manage.py migrate --noinput
      - name: Verify HTTPS redirect with production settings
        run: |
          python - <<'PY'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "core.settings")
          import django
          django.setup()
          from django.conf import settings
          from django.test import Client
          assert settings.SECURE_SSL_REDIRECT is True
          response = Client(HTTP_HOST="localhost").get("/admin/login/")
          assert response.status_code == 301, response.status_code
          assert response["Location"] == "https://localhost/admin/login/"
          from django.urls import reverse
          secure_response = Client(HTTP_HOST="localhost").get("/admin/login/", secure=True)
          assert secure_response.status_code == 302, secure_response.status_code
          assert secure_response["Location"] == reverse("login"), secure_response["Location"]

          PY
      - name: Django tests
        run: |
          python - <<'PY'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "core.settings")
          import django
          django.setup()
          from django.conf import settings
          from django.test.utils import get_runner
          settings.SECURE_SSL_REDIRECT = False
          failures = get_runner(settings)(interactive=False).run_tests(["cozinha", "seguranca"])
          raise SystemExit(bool(failures))
          PY
